# WorkshopOne — nginx site for storesdb.ec-workshops.online
#
# The app itself speaks plain HTTP on 127.0.0.1:3000 and is NOT reachable from outside. nginx is
# the only thing listening on the public interface: it terminates TLS, forwards to the app, and
# passes on the two headers the app needs to know the request arrived over HTTPS.
#
#   sudo cp deploy/nginx-storesdb.conf /etc/nginx/sites-available/storesdb
#   sudo ln -s /etc/nginx/sites-available/storesdb /etc/nginx/sites-enabled/storesdb
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot fill in the certificate lines:
#   sudo certbot --nginx -d storesdb.ec-workshops.online
#
# Certbot rewrites this file to add the ssl_certificate lines and the :443 block. Everything below
# is what it expects to find.

server {
    listen 80;
    listen [::]:80;
    server_name storesdb.ec-workshops.online;

    # certbot writes its challenge here and, after the certificate is issued, adds a redirect to
    # https for everything else. Until then this block serves the app directly so you can check the
    # deployment works before involving TLS.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WITHOUT THESE the app cannot tell an https request from an http one, and the session
        # cookie goes out without its Secure flag — which is the whole point of putting nginx here.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live-update socket is a long-lived upgraded connection; without these it is dropped
        # and every screen silently stops refreshing itself.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Evidence photographs are the largest thing the workshop uploads; the default 1M would refuse
    # a battery serial photograph taken on a modern phone.
    client_max_body_size 12m;
}
