# WorkshopOne — nginx site for storesdb.ec-workshops.online, behind Cloudflare
#
# Cloudflare terminates TLS for the visitor and connects to this server as the origin. So there are
# two encrypted hops, and both matter:
#
#     visitor  --https-->  Cloudflare  --https-->  this nginx  --http-->  app on 127.0.0.1:3000
#
# The second hop is encrypted with a Cloudflare ORIGIN CERTIFICATE (free, 15 years, trusted only by
# Cloudflare) and the SSL mode in the dashboard must be **Full (Strict)**. Do not use "Flexible":
# it leaves Cloudflare-to-origin as plain HTTP across the public internet while showing the visitor
# a padlock, which is worse than no padlock at all because it looks safe.
#
# Install:
#   sudo cp deploy/nginx-storesdb.conf /etc/nginx/sites-available/storesdb
#   sudo ln -s /etc/nginx/sites-available/storesdb /etc/nginx/sites-enabled/storesdb
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# WHOSE WORD WE TAKE FOR THE VISITOR'S ADDRESS.
#
# Every request arrives from a Cloudflare address, so without this the app would see one of a few
# hundred Cloudflare IPs instead of the visitor — and the login rate limiter, which counts by
# address, would treat the whole internet as one caller.
#
# set_real_ip_from lists the networks allowed to speak for someone else. A header from anywhere
# else is ignored, which is the point: the ranges are the trust boundary, so they must be
# Cloudflare's real list rather than a guess. Generate the file, do not type it:
#
#   { curl -sf https://www.cloudflare.com/ips-v4; echo; curl -sf https://www.cloudflare.com/ips-v6; echo; } | tr -d '\r' | grep -E '^[0-9a-fA-F.:]+/[0-9]{1,3}$' | sed 's|^|set_real_ip_from |; s|$|;|' | sudo tee /etc/nginx/cloudflare-real-ip.conf > /dev/null && echo 'real_ip_header CF-Connecting-IP;' | sudo tee -a /etc/nginx/cloudflare-real-ip.conf > /dev/null && grep -c set_real_ip_from /etc/nginx/cloudflare-real-ip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The count at the end should be about 22, and MUST NOT be 0 -- an empty file here loads fine and
# breaks the rate limiter silently, which is the worst way for this to fail.
#
# The bare `echo` after each curl is not decoration. NEITHER CLOUDFLARE FILE ENDS IN A NEWLINE, so
# appending them directly glues the last IPv4 range onto the first IPv6 one:
#
#     set_real_ip_from 131.0.72.0/222400:cb00::/32;
#
# which nginx rejects outright ("host not found in set_real_ip_from") and which also swallows
# 2400:cb00::/32 -- so a config that loaded despite it would be missing a live Cloudflare range.
# The grep guards the other direction: a failed fetch yields an empty file, not an HTML error page
# pasted into your nginx configuration.
#
# Cloudflare adds ranges occasionally; re-run it after a change, or on a monthly cron.
# ---------------------------------------------------------------------------
include /etc/nginx/cloudflare-real-ip.conf;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storesdb.ec-workshops.online;

    # The Cloudflare Origin Certificate. Create it in the dashboard under
    # SSL/TLS -> Origin Server -> Create Certificate, and save the two halves here:
    ssl_certificate     /etc/ssl/cloudflare/storesdb.pem;
    ssl_certificate_key /etc/ssl/cloudflare/storesdb.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # $remote_addr is the REAL visitor by the time this runs, because of the real_ip block
        # above. Without that it would be a Cloudflare address and every visitor would look
        # like the same person.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # The app decides whether to mark the session cookie Secure from this header. Cloudflare
        # always speaks to us over https, so it is always https.
        proxy_set_header X-Forwarded-Proto https;

        # The live-update socket is a long-lived upgraded connection. Without these it is dropped
        # and every screen quietly stops refreshing itself.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Evidence photographs are the largest thing the workshop uploads; the default 1M would refuse
    # a battery serial photograph taken on a modern phone.
    client_max_body_size 12m;
}

# Plain HTTP on the origin. Cloudflare reaches us on 443, so this exists only to catch anyone
# who found the server's own address and typed http:// — including a scanner.
server {
    listen 80;
    listen [::]:80;
    server_name storesdb.ec-workshops.online 20.204.51.43 _;
    return 301 https://storesdb.ec-workshops.online$request_uri;
}
