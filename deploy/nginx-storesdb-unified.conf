# WorkshopOne Unified — Nginx site for storesdb.ec-workshops.online, behind Cloudflare
# Proxies HTTPS traffic to the unified WorkshopOne + Fuel + Fleet app on 127.0.0.1:3400.
#
# Install:
#   sudo cp /opt/workshopone-unified/app/deploy/nginx-storesdb-unified.conf /etc/nginx/sites-available/storesdb
#   sudo ln -sf /etc/nginx/sites-available/storesdb /etc/nginx/sites-enabled/storesdb
#   sudo nginx -t && sudo systemctl reload nginx

# Trust Cloudflare edge IPs for real visitor address resolution (login rate limiter)
include /etc/nginx/cloudflare-real-ip.conf;

server {
    # Keep HTTP/2 on listen line for Ubuntu 22.04 (nginx 1.18) and 24.04 (nginx 1.24) compatibility
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storesdb.ec-workshops.online;

    # Cloudflare Origin Certificate (SSL/TLS mode in Cloudflare: Full Strict)
    ssl_certificate     /etc/ssl/cloudflare/storesdb.pem;
    ssl_certificate_key /etc/ssl/cloudflare/storesdb.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support for live-update sync across open browsers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Evidence photographs, MRN attachments, fuel receipts, CCOM PDFs
    client_max_body_size 25m;
}

# Redirect plain HTTP requests to canonical HTTPS domain
server {
    listen 80;
    listen [::]:80;
    server_name storesdb.ec-workshops.online 20.204.51.43 _;
    return 301 https://storesdb.ec-workshops.online$request_uri;
}
