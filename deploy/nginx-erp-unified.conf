# WorkshopOne Unified — Nginx site for erp.edchristerp.com
# Proxies HTTPS traffic to the unified WorkshopOne + Fuel + Fleet app on 127.0.0.1:3400.
# Configured for direct Hostinger DNS with auto-renewing Let's Encrypt TLS.
#
# Install:
#   sudo cp /opt/workshopone-unified/app/deploy/nginx-erp-unified.conf /etc/nginx/sites-available/erp
#   sudo ln -sf /etc/nginx/sites-available/erp /etc/nginx/sites-enabled/erp
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # Keep HTTP/2 on listen line for Ubuntu 22.04 (nginx 1.18) and 24.04 (nginx 1.24) compatibility
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.edchristerp.com;

    # Uncomment only if you later put edchristerp.com behind Cloudflare proxy (must stay inside server {}):
    # include /etc/nginx/cloudflare-real-ip.conf;

    # Let's Encrypt TLS Certificate (issued via `deploy/vps-cutover.sh setup-ssl` for Hostinger DNS)
    ssl_certificate     /etc/letsencrypt/live/erp.edchristerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.edchristerp.com/privkey.pem;
    # Optional alternative if proxying behind Cloudflare SSL Full (Strict):
    # ssl_certificate     /etc/ssl/cloudflare/erp.edchristerp.com.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/erp.edchristerp.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support for live-update sync across open browsers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Evidence photographs, MRN attachments, fuel receipts, CCOM PDFs
    client_max_body_size 25m;
}

# Redirect plain HTTP requests to canonical HTTPS domain (preserving ACME HTTP-01 challenges)
server {
    listen 80;
    listen [::]:80;
    server_name erp.edchristerp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://erp.edchristerp.com$request_uri;
    }
}
