# =============================================================================
#  storesdb.ec-workshops.online -> redirect to Unified ERP (https://erp.edchristerp.com)
#
#  Replaces /etc/nginx/sites-available/storesdb after Unified Cutover so legacy
#  bookmarks and saved shortcuts land smoothly on erp.edchristerp.com.
#
#  Install:
#      sudo cp /opt/workshopone-unified/app/deploy/nginx-storesdb-redirect.conf /etc/nginx/sites-available/storesdb
#      sudo ln -sf /etc/nginx/sites-available/storesdb /etc/nginx/sites-enabled/storesdb
#      sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Preserve top-level Cloudflare real-IP trust for existing server blocks
include /etc/nginx/cloudflare-real-ip.conf;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storesdb.ec-workshops.online;

    ssl_certificate     /etc/ssl/cloudflare/storesdb.pem;
    ssl_certificate_key /etc/ssl/cloudflare/storesdb.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 302 https://erp.edchristerp.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name storesdb.ec-workshops.online 167.71.206.10 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 302 https://erp.edchristerp.com$request_uri;
    }
}
