# =============================================================================
#  fuelsystem.ec-workshops.online -> temporary redirect into Unified Fuel UI
#
#  Replaces /etc/nginx/sites-available/fuelsystem during Unified Cutover so old
#  bookmarks land directly in https://erp.edchristerp.com/#/fuel
#  instead of hitting a 502 Bad Gateway after stopping :3300.
#
#  Install:
#      sudo cp /opt/workshopone-unified/app/deploy/nginx-fuelsystem-redirect.conf /etc/nginx/sites-available/fuelsystem
#      sudo ln -sf /etc/nginx/sites-available/fuelsystem /etc/nginx/sites-enabled/fuelsystem
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Notes:
#  - Deliberately omits any catch-all server flag or duplicate Cloudflare real-ip /
#    upgrade map declarations so it never conflicts with storesdb, erp, or conf.d.
#  - If fuelsystem already terminates origin TLS on :443 on this host, enable the
#    commented 443 block below with the existing certificate paths (or let
#    deploy/vps-cutover.sh preserve them automatically).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fuelsystem.ec-workshops.online;

    # Preserve HTTP-01 challenge endpoint ahead of redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 302 https://erp.edchristerp.com/#/fuel;
    }
}

