<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Zoom is left ON. maximum-scale=1 / user-scalable=no gives an app-like feel but takes away the
       one thing a storekeeper can do about a wide table on a small screen, and it is the usual
       accessibility complaint. viewport-fit is kept for the notched phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WorkshopOne — Central Workshop Master System</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body>
  <div id="app"><div class="login-wrap"><div class="muted">Loading…</div></div></div>
  <script src="/js/server-config.js"></script>
  <script src="/app.js"></script>
  <script src="/js/live-client.js"></script>
  <script src="/js/mobile-nav.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW reg error:', err));
      });
    }
  </script>
</body>
</html>
