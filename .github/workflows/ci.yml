name: WorkshopOne CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

jobs:
  test:
    name: Node 20 Invariants & Full Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core architectural & security invariant checks
        run: |
          node --test \
            test/capabilities.test.js \
            test/csp_enforced.test.js \
            test/public_js_syntax.test.js \
            test/phase5c_frontend_modularization.test.js \
            test/w0_groundwork.test.js

      - name: Run full test suite
        run: npm test
